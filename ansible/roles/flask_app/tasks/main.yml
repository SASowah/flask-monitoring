---
- name: Ensure app directory exists
  file:
    path: /opt/flask_app
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy Flask app
  copy:
    src: app.py
    dest: /opt/flask_app/app.py

- name: Copy requirements file
  copy:
    src: requirements.txt
    dest: /opt/flask_app/requirements.txt

- name: Copy Dockerfile
  copy:
    src: Dockerfile
    dest: /opt/flask_app/Dockerfile

- name: Copy docker-compose.yml
  copy:
    src: docker-compose.yml
    dest: /opt/flask_app/docker-compose.yml

- name: Copy Nginx config
  copy:
    src: flask_proxy.conf
    dest: /opt/flask_app/flask_proxy.conf

- name: Create Prometheus config directory
  file:
    path: /opt/flask_app/prometheus
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Copy Prometheus config
  copy:
    src: prometheus.yml
    dest: /opt/flask_app/prometheus/prometheus.yml
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Verify Prometheus config file permissions (for debugging)
  command: ls -l /opt/flask_app/prometheus/prometheus.yml
  register: prometheus_ls
  changed_when: false

- name: Show Prometheus config file details
  debug:
    var: prometheus_ls.stdout_lines

- name: Build and run all containers (Flask+Gunicorn, Prometheus, Grafana)
  command: docker compose up -d --build
  args:
    chdir: /opt/flask_app
  register: docker_compose_build

- name: Confirm containers are up
  debug:
    msg: "✅ Docker Compose ran successfully!"
  when: docker_compose_build.rc == 0

- name: Show running containers (for visibility)
  command: docker ps
  register: running_containers
  changed_when: false

- name: Show docker ps output
  debug:
    var: running_containers.stdout_lines
