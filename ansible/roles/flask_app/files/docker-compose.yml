version: '3.8'

services:
  flask_app:
    build: .
    ports:
      - "5000:5000"
    container_name: flask-monitor
    restart: unless-stopped
    networks:
      - monitoring-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
    - ./flask_proxy.conf:/etc/nginx/conf.d/flask_proxy.conf
    depends_on:
      - flask_app
    restart: always
    networks:
      - monitoring-network
      
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - monitoring-network

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - monitoring-network

networks:
  monitoring-network:
    driver: bridge